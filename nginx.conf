# Serves only the static dashboard. In the cluster the ALB routes "/" here and "/api/*" to lab-backend;
# CloudFront serves /images/* and /metrics/* from S3, so nginx never sees those.
# Runs as the unprivileged nginx user (uid 101) on 8080 with a read-only root filesystem:
# pid, temp and cache paths live under /tmp and /var/cache/nginx (emptyDir mounts in the chart).
pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    location / {
      try_files $uri $uri/ =404;
    }
    location ~* \.(js|css)$ {
      add_header Cache-Control "no-cache";   # revalidate: assets are not fingerprinted
      add_header X-Content-Type-Options nosniff always;
    }
  }
}
