name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm test
      - name: Syntax check
        run: node --check src/app.js && node --check src/lib.js

  image:
    needs: test
    uses: sarunas-k/lab-aws-github-workflows/.github/workflows/app-ci.yml@main
    with:
      image-name: lab-web
