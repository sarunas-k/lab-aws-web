name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm test
      - name: Syntax check
        run: node --check src/app.js && node --check src/lib.js
      - name: Build image (no push)
        run: docker build -t lab-web:ci .
      # TODO: SonarCloud, Trivy, hadolint, ECR push, cosign, the gitops bump, and
      #   aws s3 sync src/images s3://lab-<env>-assets/images --delete
      # (role lab-github-assets-sync) come from the reusable workflows in lab-github-workflows.
